[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-trust-annotations"
version = "0.1.0"
description = "SEP-1913 Trust & Sensitivity Annotations SDK for Model Context Protocol"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "MCP Trust Contributors" }]
keywords = ["mcp", "trust", "annotations", "security", "data-classification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

# Zero runtime dependencies — stdlib only
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.urls]
Repository = "https://github.com/modelcontextprotocol/experimental-ext-tool-annotations"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
